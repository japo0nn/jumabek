# JumaBek configuration

[memory]
db_path = "~/.jumabek/jumabek.db"

[llm]
model = "oc/big-pickle"
base_uri = "http://localhost:20128/api"
system_prompt_path = "./prompt.md"
context_token_limit = 200000
retry_max_retries = 3
retry_initial_delay_ms = 1000

# Ollama on the desktop, for when it is wanted again. It listens on 11434, not
# 20128 — nothing is on 20128 over there. `reasoning_effort = "none"` is what
# actually stops a hybrid model thinking out loud; Ollama's own `think` field is
# ignored by the OpenAI-compatible endpoint. `request_timeout_sec` matters
# because a model on CPU can spend minutes on one turn.
#
# model = "qwen3.5:4b"
# base_uri = "http://192.168.60.41:11434/v1"
# context_token_limit = 16000
# reasoning_effort = "none"
# request_timeout_sec = 900

[agent]
max_iterations = 10
max_fix_iterations = 5
interface = "cli"
skill_timeout_sec = 360
voice_name = "Microsoft Irina Desktop"
language = "ru"
carry_over_messages = 30

[preflight]
enabled = true
image = "rust:1-slim"
build_cpu = "2"
build_memory = "2g"
run_cpu = "0.5"
run_memory = "256m"
build_timeout_sec = 600
allow_without_docker = false

[inbox]
enabled = true
port = 20129
ask_timeout_sec = 300

[inbox.grants.selftest]
skills = []
new_skills = false
risky = false

[inbox.grants.telegram]
skills = ["telegram", "shell_executor"]
new_skills = false
risky = false
