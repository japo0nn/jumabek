[package]
name = "shell_executor"
description = "The built-in JumaBek skill that runs shell commands"
version.workspace = true
edition.workspace = true
license = "MIT"
repository.workspace = true

[dependencies]
jumabek_sdk = { path = "../../jumabek_sdk" }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
encoding_rs = "0.8.35"

[target.'cfg(unix)'.dependencies]
libc = "0.2"